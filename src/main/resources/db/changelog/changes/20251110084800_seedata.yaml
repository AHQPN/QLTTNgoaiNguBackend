databaseChangeLog:
  # ----------------- 1. Seed kỹ năng -----------------
  - changeSet:
      id: seed-skill
      author: admin
      changes:
        - insert:
            tableName: kynang
            columns:
              - column: { name: tenkynang, value: Listening }
        - insert:
            tableName: kynang
            columns:
              - column: { name: tenkynang, value: Speaking }
        - insert:
            tableName: kynang
            columns:
              - column: { name: tenkynang, value: Writing }
        - insert:
            tableName: kynang
            columns:
              - column: { name: tenkynang, value: Reading }

  # ----------------- 2. Seed course-skill (khoahockynang) -----------------
  - changeSet:
      id: seed-course-skill-7courses
      author: admin
      changes:
        # Khóa 1: IELTS Writing → Writing
        - insert:
            tableName: khoahockynang
            columns:
              - column: { name: makhoahoc, valueNumeric: 1 }
              - column: { name: makynang, valueNumeric: 3 } # Writing

        # Khóa 2: IELTS Speaking → Speaking
        - insert:
            tableName: khoahockynang
            columns:
              - column: { name: makhoahoc, valueNumeric: 2 }
              - column: { name: makynang, valueNumeric: 2 } # Speaking

        # Khóa 3: IELTS Listening → Listening
        - insert:
            tableName: khoahockynang
            columns:
              - column: { name: makhoahoc, valueNumeric: 3 }
              - column: { name: makynang, valueNumeric: 1 } # Listening

        # Khóa 4: IELTS Reading → Reading
        - insert:
            tableName: khoahockynang
            columns:
              - column: { name: makhoahoc, valueNumeric: 4 }
              - column: { name: makynang, valueNumeric: 4 } # Reading

        # Khóa 5: IELTS Vocabulary → Speaking + Writing
        - insert:
            tableName: khoahockynang
            columns:
              - column: { name: makhoahoc, valueNumeric: 5 }
              - column: { name: makynang, valueNumeric: 2 } # Speaking
        - insert:
            tableName: khoahockynang
            columns:
              - column: { name: makhoahoc, valueNumeric: 5 }
              - column: { name: makynang, valueNumeric: 3 } # Writing

        # Khóa 6: IELTS Grammar → Writing + Speaking
        - insert:
            tableName: khoahockynang
            columns:
              - column: { name: makhoahoc, valueNumeric: 6 }
              - column: { name: makynang, valueNumeric: 3 } # Writing
        - insert:
            tableName: khoahockynang
            columns:
              - column: { name: makhoahoc, valueNumeric: 6 }
              - column: { name: makynang, valueNumeric: 2 } # Speaking

        # Khóa 7: IELTS Full Preparation → 4 kỹ năng
        - insert:
            tableName: khoahockynang
            columns:
              - column: { name: makhoahoc, valueNumeric: 7 }
              - column: { name: makynang, valueNumeric: 1 } # Listening
        - insert:
            tableName: khoahockynang
            columns:
              - column: { name: makhoahoc, valueNumeric: 7 }
              - column: { name: makynang, valueNumeric: 2 } # Speaking
        - insert:
            tableName: khoahockynang
            columns:
              - column: { name: makhoahoc, valueNumeric: 7 }
              - column: { name: makynang, valueNumeric: 3 } # Writing
        - insert:
            tableName: khoahockynang
            columns:
              - column: { name: makhoahoc, valueNumeric: 7 }
              - column: { name: makynang, valueNumeric: 4 } # Reading

  # ----------------- 3. Xóa cột makhoahoc trong module -----------------
  - changeSet:
      id: remove-makhoahoc-module
      author: admin
      changes:
        - dropColumn:
            columnName: makhoahoc
            tableName: module

  # ----------------- 4. Cập nhật module.makhkn dựa trên khoahockynang thực tế -----------------
  - changeSet:
      id: update-module-makhkn
      author: admin
      changes:
        - sql:
            splitStatements: false
            sql: |
              DECLARE @kh1 INT = (SELECT TOP 1 makhkn FROM khoahockynang WHERE makhoahoc = 1);
              UPDATE module SET makhkn = @kh1 WHERE mamodule BETWEEN 1 AND 8;

              DECLARE @kh2 INT = (SELECT TOP 1 makhkn FROM khoahockynang WHERE makhoahoc = 2);
              UPDATE module SET makhkn = @kh2 WHERE mamodule BETWEEN 9 AND 16;

              DECLARE @kh3 INT = (SELECT TOP 1 makhkn FROM khoahockynang WHERE makhoahoc = 3);
              UPDATE module SET makhkn = @kh3 WHERE mamodule BETWEEN 17 AND 24;

              DECLARE @kh4 INT = (SELECT TOP 1 makhkn FROM khoahockynang WHERE makhoahoc = 4);
              UPDATE module SET makhkn = @kh4 WHERE mamodule BETWEEN 25 AND 32;

              DECLARE @kh5 INT = (SELECT TOP 1 makhkn FROM khoahockynang WHERE makhoahoc = 5);
              UPDATE module SET makhkn = @kh5 WHERE mamodule BETWEEN 33 AND 40;

              DECLARE @kh6 INT = (SELECT TOP 1 makhkn FROM khoahockynang WHERE makhoahoc = 6);
              UPDATE module SET makhkn = @kh6 WHERE mamodule BETWEEN 41 AND 48;

              DECLARE @kh7 INT = (SELECT TOP 1 makhkn FROM khoahockynang WHERE makhoahoc = 7);
              UPDATE module SET makhkn = @kh7 WHERE mamodule BETWEEN 49 AND 56;
