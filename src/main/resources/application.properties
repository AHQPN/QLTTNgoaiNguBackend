app.site-url=${APP_SITE_URL:http://localhost:8080}
file.upload-dir=${user.dir}/uploads/images
spring.application.name=${SPRING_APPLICATION_NAME:QLTTNgoaiNgu}

spring.datasource.url=${DATASOURCE_URL:jdbc:sqlserver://localhost:1433;databaseName=QLTTNgoaiNgu;encrypt=true;trustServerCertificate=true}
spring.datasource.username=${DATASOURCE_USERNAME:sa}
spring.datasource.password=${DATASOURCE_PASSWORD:your_password}
spring.datasource.driver-class-name=${DATASOURCE_DRIVER_CLASS_NAME:com.microsoft.sqlserver.jdbc.SQLServerDriver}

spring.jpa.hibernate.ddl-auto=${JPA_HIBERNATE_DDL_AUTO:none}
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.dialect=${HIBERNATE_DIALECT:org.hibernate.dialect.SQLServerDialect}

app.jwtSecret=${APP_JWT_SECRET:your_jwt_secret_key_min_256_bits_long_for_hs256_algorithm}
app.jwtExpirationMs=${APP_JWT_EXPIRATION_MS:86400000}
app.jwtRefreshExpirationMs=${APP_JWT_REFRESH_EXPIRATION_MS:604800000}
app.jwt.token-prefix=${APP_JWT_TOKEN_PREFIX:Bearer }
app.jwt.header=${APP_JWT_HEADER:Authorization}

spring.liquibase.change-log=${LIQUIBASE_CHANGELOG:classpath:db/changelog/db.changelog-master.yaml}
spring.liquibase.enabled=${LIQUIBASE_ENABLED:true}


# Spring Mail
spring.mail.host=${GMAIL_SMTP_HOST:smtp.gmail.com}
spring.mail.port=${GMAIL_SMTP_PORT:587}
spring.mail.username=${GMAIL_USERNAME:nguyenbro9721@gmail.com}
spring.mail.password=${GMAIL_PASSWORD:your_app_password}
spring.mail.properties.mail.smtp.auth=${GMAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${GMAIL_SMTP_STARTTLS_ENABLE:true}
spring.mail.properties.mail.smtp.starttls.required=${GMAIL_SMTP_STARTTLS_REQUIRED:true}


